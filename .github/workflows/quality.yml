name: Quality Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1 : workspace principal (application + packages Flutter et Dart)
  # Exclut spikes/** via analysis_options.yaml — les dépendances du spike
  # ne font pas partie du workspace Pub racine.
  # ─────────────────────────────────────────────────────────────────────────────
  quality:
    name: Quality — workspace principal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Install locked workspace dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run local quality gate
        run: dart run melos run quality --no-select

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2 : spike SPK-DB-001 (package + application exemple)
  # Exécuté dans son propre contexte Pub, isolé du workspace racine.
  #
  # Note : les tests unitaires du spike utilisent NativeDatabase (sqlite3mc).
  # Le hook `source: sqlite3mc` compile SQLite3MultipleCiphers depuis les sources
  # via cmake lors du `pub get`. L'agent ubuntu-latest dispose de cmake et gcc.
  # La validation Android complète (phase_a/phase_b) requiert un émulateur et
  # reste documentée séparément (cf. SPK_DB_001_AUDIT.md).
  # ─────────────────────────────────────────────────────────────────────────────
  quality-spike:
    name: Quality — spike SPK-DB-001
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      # Dépendances système requises pour compiler sqlite3mc (cmake, clang)
      - name: Install native build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y cmake clang ninja-build libgtk-3-dev

      # ── Package spk_db_001 ───────────────────────────────────────────────────
      - name: pub get — spk_db_001
        working-directory: spikes/spk_db_001
        run: flutter pub get

      - name: Format — spk_db_001
        working-directory: spikes/spk_db_001
        run: |
          dart format --output=none --set-exit-if-changed \
            lib test example/lib example/test example/integration_test

      - name: Analyze — spk_db_001
        working-directory: spikes/spk_db_001
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings

      - name: Test — spk_db_001
        working-directory: spikes/spk_db_001
        run: flutter test --no-pub

      # ── Application exemple (widget tests uniquement, sans intégration native) ─
      - name: pub get — example
        working-directory: spikes/spk_db_001/example
        run: flutter pub get

      - name: Analyze — example
        working-directory: spikes/spk_db_001/example
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings

      - name: Test widgets — example
        working-directory: spikes/spk_db_001/example
        # Cible uniquement test/ (widget_test.dart).
        # integration_test/ (phase_a/phase_b) requiert un émulateur Android
        # et est exclu de la CI standard.
        run: flutter test test/ --no-pub
